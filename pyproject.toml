[project]
name = "blockchain-demo"
version = "0.1.0"
description = "A from-scratch, offline, BFT proof-of-stake blockchain (Tendermint-style consensus)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
blockchain-demo = "blockchain_demo:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
